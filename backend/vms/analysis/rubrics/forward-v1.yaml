# Forward (packing) SOP rubric. Thresholds carried over from the v1 analyzer.
# Any change to checks or thresholds needs a new id (forward-v2) so old analyses stay explainable.
id: forward-v1
process_type: Forward
title: Forward (Packing) SOP
decision:
  pass:   { min_score: 85, min_confidence: 0.70 }
  review: { min_score: 50, min_confidence: 0.40 }
caps:
  - { id: no_barcode_max_review,  when: { metric: barcode_found,    op: "==", value: false }, max_status: review }
  - { id: low_quality_max_review, when: { metric: quality_ok_ratio, op: "<",  value: 0.5 },   max_status: review }
  - { id: too_short_fail,         when: { metric: duration_s,       op: "<",  value: 3 },     max_status: fail }
steps:
  - key: shipping_label
    title: Shipping Label & Barcode
    description: Label clearly visible, barcode readable before sealing
    evidence: [barcode, label]
    checks:
      - { key: label_text_visible, metric: avg_text_blocks,  op: ">",  value: 5,    points: 10, fail_note: "No clear text/label detected. Hold label closer." }
      - { key: label_held,         metric: max_label_hold_s, op: ">=", value: 2.0,  points: 5,  fail_note: "Label not held steady for 2 seconds." }
      - { key: barcode_read,       metric: barcode_found,    op: "==", value: true, points: 15, fail_note: "Barcode not read. Ensure it is in focus." }
  - key: packing
    title: Packing & Sealing
    description: Item packed correctly, bag/box sealed fully on camera
    evidence: [package, motion]
    checks:
      - { key: package_visible, metric: package_ratio,      op: ">",  value: 0.4, points: 8, fail_note: "Package not consistently visible." }
      - { key: sealing_motion,  metric: end_activity_ratio, op: ">=", value: 0.3, points: 6, fail_note: "No sealing activity seen at the end of the video." }
      - { key: long_enough,     metric: duration_s,         op: ">",  value: 10,  points: 6, fail_note: "Video too short for full process." }
  - key: tags
    title: Brand Tag & Hangtag
    description: Brand tags attached and visible before packing
    evidence: [tag, text]
    checks:
      - { key: tag_visible,  metric: tag_ratio,       op: ">", value: 0.1, points: 15, fail_note: "Brand tag not detected clearly." }
      - { key: tag_readable, metric: avg_text_blocks, op: ">", value: 3,   points: 10, fail_note: "Tag text not readable." }
  - key: product
    title: Product Condition
    description: Item unfolded and inspected for defects before packing
    evidence: [product]
    checks:
      - { key: product_visible, metric: product_ratio, op: ">", value: 0.4, points: 25, fail_note: "Product not visible enough." }
