[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vms"
version = "0.2.0"
description = "VMS SOP Analyzer: scores warehouse inspection videos against the VMS SOP rubric"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2",
    "pydantic-settings>=2",
    "opencv-contrib-python-headless>=4.9",
    "numpy>=1.26",
    "pyzbar>=0.1.9",
    "pyyaml>=6",
    "sqlalchemy>=2",
    "alembic>=1.13",
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
ml = ["easyocr>=1.7", "ultralytics>=8.2"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.6", "qrcode[pil]>=8"]

[tool.setuptools.packages.find]
include = ["vms*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["models: needs EasyOCR/YOLO (run with -m models)"]
addopts = "-m \"not models\""

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query", "fastapi.Security"
]

[tool.setuptools.package-data]
vms = ["analysis/rubrics/*.yaml"]
