name: Nightly (models + ML image)

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: sudo apt-get update && sudo apt-get install -y libzbar0 libgl1
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -e "backend[dev,ml]"
      - run: pytest backend/tests -q -m models

  ml-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          build-args: WITH_ML=1
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
