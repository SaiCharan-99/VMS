name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vms
          POSTGRES_PASSWORD: vms
          POSTGRES_DB: vms_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vms" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      VMS_TEST_DB_URL: ${{ matrix.db == 'postgres' && 'postgresql+psycopg://vms:vms@localhost:5432/vms_test' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: sudo apt-get update && sudo apt-get install -y libzbar0
      - run: pip install -e "backend[dev,postgres]"
      - run: ruff check backend && ruff format --check backend
        if: matrix.db == 'sqlite'
      - run: pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # backend/tests/test_openapi_snapshot.py keeps openapi.json current; this keeps the
      # generated TS types current with openapi.json.
      - name: Generated API types are up to date
        run: npm run gen:api && git diff --exit-code -- src/types/openapi.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y libzbar0
      - run: pip install pip-audit "./backend[postgres]"
      - name: pip-audit (installed core + postgres deps; the local vms package is skipped)
        run: pip-audit --progress-spinner off --skip-editable
      - name: npm audit (production deps)
        working-directory: frontend
        run: npm ci && npm audit --omit=dev --audit-level=high

  e2e:
    name: docker build + E2E smoke
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Production .env
        run: |
          cp .env.example .env
          sed -i "s|^VMS_JWT_SECRET=.*|VMS_JWT_SECRET=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')|" .env
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=ci-$(python -c 'import secrets; print(secrets.token_hex(8))')|" .env
          # The ML image (torch, EasyOCR, YOLO) is built nightly; the smoke test checks the
          # wiring, and detectors degrade gracefully to review/fail without it.
          sed -i "s|^WITH_ML=.*|WITH_ML=0|" .env
      - name: Start the stack (production compose file only)
        run: docker compose -f docker-compose.yml up -d --build --wait --scale worker=2
      - name: Create an admin
        run: echo "e2e-password-123" | docker compose -f docker-compose.yml exec -T api python -m vms.cli create-admin --email e2e@vms.test --name "E2E" --password-stdin
      - name: Synthetic video
        run: |
          pip install "opencv-python-headless>=4.9" "qrcode[pil]>=8" numpy
          cd backend && python -c "from pathlib import Path; from tests.fixtures.video_factory import make_video; make_video(Path('../e2e-video.mp4'), seconds=6, qr_text='AWB-E2E-1', text='SHIP TO')"
      - name: Playwright
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost
          E2E_EMAIL: e2e@vms.test
          E2E_PASSWORD: e2e-password-123
          E2E_VIDEO: ${{ github.workspace }}/e2e-video.mp4
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Stack logs
        if: failure()
        run: docker compose -f docker-compose.yml logs --no-color
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
