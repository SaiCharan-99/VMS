# Production stack: docker compose -f docker-compose.yml up -d   (see docs/DEPLOY.md)
# `docker compose up -d` also loads docker-compose.override.yml (local dev conveniences).
# Scale analysis: docker compose up -d --scale worker=4

x-backend: &backend
  image: ${VMS_IMAGE:-vms-backend}:${VMS_TAG:-latest}
  env_file: .env
  environment:
    VMS_DB_URL: postgresql+psycopg://${POSTGRES_USER:-vms}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vms}
    VMS_DATA_DIR: /data
  volumes:
    - vms-data:/data
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-vms}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *backend
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    # Built once here; migrate and worker run the same image.
    build:
      context: ./backend
      args:
        WITH_ML: ${WITH_ML:-1}
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *backend
    command: ["python", "-m", "vms.worker"]
    environment:
      VMS_DB_URL: postgresql+psycopg://${POSTGRES_USER:-vms}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vms}
      VMS_DATA_DIR: /data
      VMS_WORKER_METRICS_PORT: "9100"
    healthcheck:
      disable: true
    # The worker releases its job back to the queue on SIGTERM; give it time to notice.
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build: ./frontend
    image: ${VMS_WEB_IMAGE:-vms-web}:${VMS_TAG:-latest}
    environment:
      MAX_UPLOAD_MB: ${VMS_MAX_UPLOAD_MB:-500}
    ports:
      - "${VMS_HTTP_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg-data:
  vms-data:
